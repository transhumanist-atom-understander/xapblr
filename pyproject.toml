[project]
name = "xapblr"
dynamic = ["version"]
authors = [
  { name="Siegfried Kircheis", email="kircheis.siegfried@proton.me" },
]
description = "Locally index a tumblr blog with xapian for searching."
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# xapian-bindings builds the bindings from source at install time: it needs
# xapian-core (with its headers and xapian-config) and a C++ compiler.
dependencies = [
    "sqlalchemy>=1.4",
    "pytumblr2",
    "dateparser",
    "requests",
    "xapian-bindings",
]

[project.optional-dependencies]
# Web interface (`xapblr server`). Also needs the `sass` and `pandoc`
# executables; running it under uwsgi needs a system uwsgi with its python
# plugin (see config/uwsgi/xapblr.ini).
web = [
    "flask",
    "flask-assets",
]
# CLIP captioning agent (`xapblr clip`)
clip = [
    "pillow",
    "open-clip-torch",
]
# Nicer human-readable timestamps in log messages and listings
humanfriendly = [
    "humanfriendly",
]
all = [
    "xapblr[web,clip,humanfriendly]",
]

[tool.uv.sources]
pytumblr2 = { git = "https://github.com/transhumanist-atom-understander/pytumblr2", branch = "master" }

[build-system]

requires = [
    "setuptools >= 42",
    "versioningit",
]
build-backend = "setuptools.build_meta"


[tool.setuptools.package-data]
xapblr = ["config.json"]
xapblr_web = ["static/*", "templates/*"]

[tool.versioningit]
# Used when no version tag is reachable (e.g. a fork without tags).
default-version = "0.2.1"

[tool.versioningit.vcs]
method = "git"

[project.scripts]
xapblr = "xapblr:main"

[project.urls]
"Homepage" = "https://github.com/skircheis/xapblr"
"Bug Tracker" = "https://github.com/skircheis/xapblr/issues"
